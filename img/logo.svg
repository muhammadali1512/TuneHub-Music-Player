<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  
  <!-- Background -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2027"/>
      <stop offset="100%" stop-color="#2c5364"/>
    </linearGradient>

    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1DB954"/>
      <stop offset="100%" stop-color="#1ed760"/>
    </linearGradient>
  </defs>

  <circle cx="100" cy="100" r="95" fill="url(#bg)"/>

  <!-- Sound Waves -->
  <path d="M50 95 Q100 55 150 95" stroke="url(#green)" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M60 115 Q100 85 140 115" stroke="url(#green)" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.9"/>
  <path d="M70 135 Q100 115 130 135" stroke="url(#green)" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.8"/>

  <!-- Play Button -->
  <circle cx="100" cy="100" r="25" fill="#121212"/>
  <polygon points="92,85 92,115 115,100" fill="url(#green)"/>

</svg>