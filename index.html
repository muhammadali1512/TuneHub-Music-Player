<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/utility.css">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <title>TUNEHUB MUSIC PLAYER</title>
</head>

<body>
    <div class="container flex  bg-black">

        <div class="left">
            <div class="close">
                <img class="invert" width="30" src="img/close.svg" alt="closeIcon">
            </div>
            <div class="home bg-grey rounded m-1 p-1">
                <div class="logo">
                    <img src="img/logo.svg" alt="Logo">
                    TUNEHUB PLAYER
                </div>
                <ul>
                    <li><img class="invert" src="img/home.svg" alt="Home">Home</li>
                    <li><img class="invert" src="img/search.svg" alt="Search">Search</li>
                </ul>
            </div>
            <div class="library bg-grey rounded m-1 p-1">
                <div class="heading">
                    <img class="invert" src="img/playlist.svg" alt="Playlist">
                    <h2>
                        Your Library
                    </h2>

                </div>
                <div class="songList">
                    <ul>


                    </ul>
                </div>
                <div class="footer">
                    <p>🎵 Created by : <span>Muhammad Ali</span></p>

                    <div class="footer-links">
                        <a href="https://github.com/muhammadali1512" target="_blank">💻 GitHub</a>
                        <a href="#">Privacy</a>
                    </div>

                    <p class="copyright">
                        © 2026 TuneHub Music Player
                    </p>
                </div>
            </div>
        </div>

        <div class="right rounded bg-grey">
            <div class="header">
                <div class="nav">
                    <div class="hamburgerContainer">
                        <img width="35" class="invert hamburger2" src="img/hamburger2.svg" alt="hamburger2">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path
                                d="M15 6L9.70711 11.2929C9.37377 11.6262 9.20711 11.7929 9.20711 12C9.20711 12.2071 9.37377 12.3738 9.70711 12.7071L15 18"
                                stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path
                                d="M9 18L14.2929 12.7071C14.6262 12.3738 14.7929 12.2071 14.7929 12C14.7929 11.7929 14.6262 11.6262 14.2929 11.2929L9 6"
                                stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                    </div>
                </div>
                <div class="buttons">
                    <button class="signupBtn">Sign Up</button>
                    <button class="loginBtn">Log In</button>
                </div>
            </div>
            <div class="tunehubPlaylists">
                <h1 id="playlist-title">
                    <<< &nbsp Welcome to TUNEHUB &nbsp>>>
                </h1>
                <div class="cardContainer">

                </div>
                <div class="playBar">
                    <div class="aboveBar">
                        <div class="songInfo"></div>
                        <div class="songBtn">
                            <img width="25" id="previous" src="img/prevSong.svg" alt="Previous">
                            <img width="25" id="play" src="img/play.svg" alt="Play">
                            <img width="25" id="next" src="img/nextSong.svg" alt="NextSong">
                        </div>
                        <div class="timeVol">


                            <div class="songTime">

                            </div>
                            <div class="volume">
                                <img width="25" id="v1" src="img/volume.svg" alt="Volume">
                                <div class="range">
                                    <input type="range" name="volume" id="v2" min="0" max="100" value="100">
                                </div>
                            </div>
                        </div>
                        <div class="seekBar">

                            <div class="circle">

                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="script/script.js"></script>
</body>

</html>
